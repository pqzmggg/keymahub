[package]
name = "win-capture"
description = "P0-1: Windows low-level hook capture, block and forward"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
keymanc-proto.workspace = true
keymanc-keymap.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
