name: release

# Publishing a GitHub release (tag like v0.2.0) builds KeymaHub, signs it with the upload key
# from the repository secrets, and attaches the APK (for sideloading) and the AAB (for Play)
# to that release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   KEMAHUB_KEYSTORE_BASE64    the keystore file, base64-encoded
#   KEMAHUB_KEYSTORE_PASSWORD  keystore password
#   KEMAHUB_KEY_ALIAS          key alias
#   KEMAHUB_KEY_PASSWORD       key password (optional: keytool's default PKCS12 keystores use the
#                              keystore password for the key too)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  kemahub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="${TAG#v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got '$TAG')"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEMAHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEMAHUB_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed build"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEMAHUB_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Check the key and passwords
        env:
          STORE_PASSWORD: ${{ secrets.KEMAHUB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEMAHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEMAHUB_KEY_PASSWORD }}
        run: |
          # Pasted secrets often end with a newline: try as given, then trimmed.
          strip() { printf '%s' "$1" | sed -e 's/[[:space:]]*$//'; }
          alias="$(strip "$KEY_ALIAS")"
          opens() { keytool -list -keystore "$KEMAHUB_KEYSTORE" -storepass "$1" -alias "$alias" > /dev/null 2>&1; }
          if opens "$STORE_PASSWORD"; then
            store="$STORE_PASSWORD"
          elif opens "$(strip "$STORE_PASSWORD")"; then
            store="$(strip "$STORE_PASSWORD")"
          else
            echo "::error::Cannot open the keystore or find alias '$alias': check KEMAHUB_KEYSTORE_BASE64, KEMAHUB_KEYSTORE_PASSWORD and KEMAHUB_KEY_ALIAS"
            exit 1
          fi
          echo "::add-mask::$store"
          type=$(keytool -list -keystore "$KEMAHUB_KEYSTORE" -storepass "$store" | sed -n 's/^Keystore type: *//p')
          echo "Keystore type: $type"
          if [ "$type" = "PKCS12" ]; then
            # PKCS12 keystores (keytool's default) protect the key with the keystore password;
            # a different key password cannot work.
            key="$store"
            if [ -n "$KEY_PASSWORD" ] && [ "$(strip "$KEY_PASSWORD")" != "$(strip "$store")" ]; then
              echo "::warning::KEMAHUB_KEY_PASSWORD differs from the keystore password; a PKCS12 key uses the keystore password, so that was used (the secret can be deleted)"
            fi
          else
            # JKS keys can have their own password.
            key_ok() {
              keytool -certreq -keystore "$KEMAHUB_KEYSTORE" -storepass "$store" -alias "$alias" \
                -keypass "$1" -file /dev/null > /dev/null 2>&1
            }
            key=""
            for candidate in "$KEY_PASSWORD" "$(strip "$KEY_PASSWORD")" "$store"; do
              if [ -n "$candidate" ] && key_ok "$candidate"; then key="$candidate"; break; fi
            done
            if [ -z "$key" ]; then
              echo "::error::Neither KEMAHUB_KEY_PASSWORD nor the keystore password opens key '$alias'"
              exit 1
            fi
          fi
          echo "::add-mask::$key"
          {
            echo "KEMAHUB_KEYSTORE_PASSWORD=$store"
            echo "KEMAHUB_KEY_ALIAS=$alias"
            echo "KEMAHUB_KEY_PASSWORD=$key"
          } >> "$GITHUB_ENV"

      - name: Build
        run: >
          ./gradlew --no-daemon :kemahub:testReleaseUnitTest :kemahub:assembleRelease :kemahub:bundleRelease
          -Pkemahub.versionName=${{ steps.version.outputs.name }}
          -Pkemahub.versionCode=${{ steps.version.outputs.code }}

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs kemahub/build/outputs/apk/release/kemahub-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p out
          cp kemahub/build/outputs/apk/release/kemahub-release.apk "out/KeymaHub-$VERSION.apk"
          cp kemahub/build/outputs/bundle/release/kemahub-release.aab "out/KeymaHub-$VERSION.aab"
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
