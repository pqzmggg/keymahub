name: ci

on:
  # Branches only: a release's tag push would repeat what the release workflow builds.
  push:
    branches: ['**']
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Android keymap is up to date with core/keymap
        run: python3 tools/gen_android_keymap.py && git diff --exit-code

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy -p win-capture --all-targets -- -D warnings
      - run: cargo test -p win-capture
      - run: cargo build --release -p win-capture -p kmc
      - uses: actions/upload-artifact@v4
        with:
          name: keymanc-p0-windows
          path: |
            target/release/win-capture.exe
            target/release/kmc.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug :keymahub:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: keymanc-p0-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: keymahub-apk
          path: |
            android/keymahub/build/outputs/apk/debug/*.apk
            android/keymahub/build/outputs/apk/release/*.apk
