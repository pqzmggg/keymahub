name: ci

# Runs on pull requests (opened and every push to them). Changes reach main only through a
# pull request, so a merge into main is not built again; releases build in the release workflow.
on:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Android keymap is up to date with core/keymap
        run: python3 tools/gen_android_keymap.py && git diff --exit-code

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug :keymahub:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: keymahub-apk
          path: |
            android/keymahub/build/outputs/apk/debug/*.apk
            android/keymahub/build/outputs/apk/release/*.apk
